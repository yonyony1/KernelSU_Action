name: Build KernelSU‑3.3.0 LKM
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu‑latest
    env:
      WORKSPACE: ${{ github.workspace }}/kernel_workspace
      DEVICE: pa3q
      KERNEL_DIR: ${{ github.workspace }}/kernel_workspace/android‑kernel
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # === 下载 s25_gki‑r21 source‑kernel.tar.gz 内核源码 ===
      - name: Download s25_gki‑r21 kernel source
        run: |
          set -e
          mkdir -p "${WORKSPACE}"
          cd "${WORKSPACE}"
          wget https://github.com/sungho‑moon/s25_gki/releases/download/v6.6.152‑r21/source‑kernel.tar.gz
          mkdir -p android‑kernel
          tar -xf source‑kernel.tar.gz -C android‑kernel

      # === 拉取 KernelSU v3.3.0 源码 ===
      - name: Checkout KernelSU v3.3.0
        run: |
          set -e
          cd "${WORKSPACE}"
          rm -rf KernelSU
          git clone --depth=1 --branch v3.3.0 https://github.com/tiann/KernelSU.git KernelSU

      # === 编译外部 LKM ksu.ko ===
      - name: Build KernelSU 3.3.0 External LKM
        run: |
          set -e
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CC=clang
          export LD=ld.lld
          export CLANG_TRIPLE=aarch64‑linux‑gnu‑

          cd "${KERNEL_DIR}"

          make ${DEVICE}_defconfig

          scripts/config --set-val KSU m
          scripts/config --set-val KPROBES y
          scripts/config --set-val KALLSYMS y
          scripts/config --set-val KALLSYMS_ALL y
          scripts/config --set-val MODULE_SIG n
          scripts/config --set-val MODULE_SIG_FORCE n

          make -j$(nproc) prepare
          make -j$(nproc) modules_prepare
          make -j$(nproc) vmlinux

          echo "==== Build external KernelSU‑3.3.0 module ===="
          make -C "${KERNEL_DIR}" M="${WORKSPACE}/KernelSU/kernel" \
            KBUILD_MODPOST_WARN=1 V=1 \
            modules

          ls -la "${WORKSPACE}/KernelSU/kernel/"
          mkdir -p "${KERNEL_DIR}/out/modules"

          if [ -f "${WORKSPACE}/KernelSU/kernel/ksu.ko" ]; then
            cp "${WORKSPACE}/KernelSU/kernel/ksu.ko" "${KERNEL_DIR}/out/modules/"
            echo "ksu.ko build success"
          else
            echo "ERROR: ksu.ko NOT generated!"
            make -C "${KERNEL_DIR}" M="${WORKSPACE}/KernelSU/kernel" V=2 modules
            exit 1
          fi

          ls -lh "${KERNEL_DIR}/out/modules/"

      # === 上传制品 ksu.ko ===
      - name: Upload ksu.ko artifact
        uses: actions/upload‑artifact@v4
        with:
          name: ksu‑pa3q‑s25gki‑r21
          path: ${{ env.KERNEL_DIR }}/out/modules/ksu.ko
