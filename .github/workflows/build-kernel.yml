name: Build Kernel Modules (LKM .ko)

on:
  workflow_dispatch:
    inputs:
      config:
        description: "Config file to build (path, relative to the repo root)"
        required: false
        default: "config.env"
        type: string
      ksu_variant:
        description: "KernelSU variant"
        required: false
        default: "config"
        type: choice
        options:
          - config
          - none
          - kernelsu
          - kernelsu-next
          - sukisu-ultra
          - resukisu
          - rsuntk
          - backslashxx
      ksu_ref:
        description: "KernelSU branch/tag/commit (blank = best default for your kernel)"
        required: false
        default: ""
        type: string
      hook_mode:
        description: "Syscall hook mechanism"
        required: false
        default: "config"
        type: choice
        options: [config, auto, kprobes, manual, tracepoint, syscall, none]
      susfs:
        description: "Apply SUSFS (mount/root hiding)"
        required: false
        default: "config"
        type: choice
        options: [config, "true", "false"]
      path_umount:
        description: "Backport path_umount() (needed on kernels older than 5.9)"
        required: false
        default: "config"
        type: choice
        options: [config, "true", "false"]
      hide_stuff:
        description: "Apply hide_stuff (extra fingerprint removal)"
        required: false
        default: "config"
        type: choice
        options: [config, "true", "false"]
      kpm:
        description: "Enable KPM (SukiSU‑Ultra only)"
        required: false
        default: "config"
        type: choice
        options: [config, "true", "false"]
      extra_defconfig:
        description: "Extra defconfig lines, space separated (e.g. CONFIG_TMPFS_XATTR=y)"
        required: false
        default: ""
        type: string
      publish_release:
        description: "Publish the build as a GitHub Release"
        required: false
        default: false
        type: boolean

  workflow_call:
    inputs:
      config:          { required: false, default: "config.env", type: string }
      ksu_variant:     { required: false, default: "config",     type: string }
      ksu_ref:         { required: false, default: "",           type: string }
      hook_mode:       { required: false, default: "config",     type: string }
      susfs:           { required: false, default: "config",     type: string }
      path_umount:     { required: false, default: "config",     type: string }
      hide_stuff:      { required: false, default: "config",     type: string }
      kpm:             { required: false, default: "config",     type: string }
      extra_defconfig: { required: false, default: "",           type: string }
      publish_release: { required: false, default: false,        type: boolean }

concurrency:
  group: build-modules-${{ github.ref }}-${{ inputs.config }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.config }} modules
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      device: ${{ steps.meta.outputs.device }}
      build_time: ${{ steps.meta.outputs.build_time }}
      ksu_name: ${{ steps.meta.outputs.ksu_name }}
      ksu_version: ${{ steps.meta.outputs.ksu_version }}
      kernel_release: ${{ steps.meta.outputs.kernel_release }}
      susfs_version: ${{ steps.meta.outputs.susfs_version }}
    env:
      WORKSPACE: ${{ github.workspace }}/kernel_workspace
      CONFIG_ENV: ${{ inputs.config }}
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

      IN_KSU_VARIANT: ${{ inputs.ksu_variant }}
      IN_KSU_REF: ${{ inputs.ksu_ref }}
      IN_KSU_HOOK_MODE: ${{ inputs.hook_mode }}
      IN_ENABLE_SUSFS: ${{ inputs.susfs }}
      IN_ENABLE_PATH_UMOUNT: ${{ inputs.path_umount }}
      IN_ENABLE_HIDE_STUFF: ${{ inputs.hide_stuff }}
      IN_ENABLE_KPM: ${{ inputs.kpm }}
      IN_EXTRA_DEFCONFIG: ${{ inputs.extra_defconfig }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve configuration
        run: bash scripts/config.sh

      - name: Free up disk space
        if: env.REMOVE_UNUSED_PACKAGES == 'true'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Add swap space
        run: |
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl device-tree-compiler flex \
            git libelf-dev libssl-dev lz4 make python3 rsync unzip zip zstd \
            libncurses-dev
          mkdir -p "$WORKSPACE"

      - name: Set up toolchain
        run: bash scripts/toolchain.sh

      - name: Fetch kernel source
        run: bash scripts/source.sh

      - name: Install KernelSU
        if: env.KSU_VARIANT != 'none'
        run: bash scripts/kernelsu.sh

      - name: Manual inject KSU into kernel Kconfig & Makefile (skip broken setup.sh)
         if: env.KSU_VARIANT != 'none'
         run: |
           cd "${KERNEL_DIR}"
           # 向顶层Kconfig追加引用KernelSU的Kconfig，避免重复写入
           if ! grep -q "KernelSU/kernel/Kconfig" Kconfig; then
             echo 'source "KernelSU/kernel/Kconfig"' >> Kconfig
           fi
           # 顶层Makefile增加KernelSU模块编译，避免重复写入
           if ! grep -q "KernelSU" Makefile; then
             echo 'obj-m += KernelSU/kernel/' >> Makefile
           fi
           echo "==== Verify inject result ===="
           grep -n "KernelSU" Kconfig
           grep -n "KernelSU" Makefile
       - name: Debug KernelSU inject check
         if: env.KSU_VARIANT != 'none'
         run: |
           echo "KERNEL_DIR=${KERNEL_DIR}"
           ls -la "${KERNEL_DIR}/KernelSU/"
           ls -la "${KERNEL_DIR}/KernelSU/kernel/"
           echo "==== Check top level Makefile ===="
           grep -n "KernelSU" "${KERNEL_DIR}/Makefile" || echo "NO KernelSU entry in top Makefile"
           echo "==== Check top Kconfig ===="
           grep -n "KernelSU" "${KERNEL_DIR}/Kconfig" || echo "NO KernelSU entry in top Kconfig"

      - name: Apply kernel patches
        run: bash scripts/patches.sh all

      - name: Set up ccache
        if: env.ENABLE_CCACHE == 'true'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: kernel-modules-${{ env.DEVICE }}-${{ env.KSU_VARIANT }}-${{ env.KERNEL_VERSION }}
          max-size: 2G

      - name: Debug check files & fix line ending
        working-directory: ${{ github.workspace }}
        run: |
          pwd
          ls -la
          ls -la scripts/
          mv -v scripts/build‑modules.sh scripts/build-modules.sh
          mv -v scripts/package‑modules.sh scripts/package-modules.sh
          sed -i 's/\r$//' scripts/build-modules.sh
          chmod +x scripts/build-modules.sh

      # ========== 重点：只编译模块，不编译Image ==========
      - name: Build kernel modules (.ko)
        working-directory: ${{ github.workspace }}
        run: bash scripts/build-modules.sh all

      - name: Debug KSU source
        run: |
          echo "=== KSU kernel dir ==="
          ls -la "${KERNEL_DIR}/KernelSU/kernel/"
          cat "${KERNEL_DIR}/KernelSU/kernel/Kbuild"
          echo "=== Try manual compile KSU ==="
          make -C "${KERNEL_DIR}" M="${KERNEL_DIR}/KernelSU/kernel" modules

      - name: Debug list ko
        run: |
            echo "MODULE_DIR = ${WORKSPACE}/android-kernel/out/modules"
            ls -la "${WORKSPACE}/android-kernel/out/modules" || echo "dir not exist"
            find "${WORKSPACE}/android-kernel" -name "*.ko"

      - name: Package artifacts (merge ko to single binary blob)
        run: bash scripts/package-modules.sh all

      - name: Export build metadata
        id: meta
        run: |
          {
            echo "device=${DEVICE}"
            echo "build_time=${BUILD_TIME}"
            echo "ksu_name=${KSU_NAME:-none}"
            echo "ksu_version=${KSU_VERSION_LABEL:-}"
            echo "kernel_release=${KERNEL_RELEASE:-}"
            echo "susfs_version=${SUSFS_VERSION:-}"
          } >> "$GITHUB_OUTPUT"

      # 上传ko原始文件 + 合并后的二进制blob
      - name: Upload raw .ko modules
        uses: actions/upload-artifact@v4
        with:
          name: modules-raw-${{ env.DEVICE }}-${{ env.BUILD_TIME }}
          path: kernel_workspace/android-kernel/out/modules/
          if-no-files-found: error

      - name: Upload merged binary blob
        uses: actions/upload-artifact@v4
        with:
          name: merged‑blob-${{ env.DEVICE }}-${{ env.BUILD_TIME }}
          path: kernel_workspace/out_merged/*.bin
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: inputs.publish_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Package module blobs
        run: |
          mkdir -p release
          shopt -s nullglob
          for f in artifacts/*/*.ko artifacts/*/*.bin; do
            [ -f "$f" ] && cp "$f" release/
          done
          ls -la release/

      - name: Create release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          tag_name: ${{ needs.build.outputs.device }}‑modules‑${{ needs.build.outputs.build_time }}
          name: ${{ needs.build.outputs.device }} · Modules · ${{ needs.build.outputs.ksu_name }} · ${{ needs.build.outputs.build_time }}
          body: |
            | | |
            | --- | --- |
            | Device | `${{ needs.build.outputs.device }}` |
            | Kernel | `${{ needs.build.outputs.kernel_release }}` |
            | KernelSU | `${{ needs.build.outputs.ksu_name }}` @ `${{ needs.build.outputs.ksu_version }}` |
            | SUSFS | `${{ needs.build.outputs.susfs_version || 'not applied' }}` |

            Raw `.ko` and merged binary blob for LKM loading.
          files: release/*
