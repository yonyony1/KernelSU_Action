name: Build S25U ksu.ko LKM
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      WORKSPACE: ${{ github.workspace }}/kernel_workspace
      CLANG_PATH: ${{ github.workspace }}/kernel_workspace/clang/bin
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install minimal build dependencies + libtinfo5 compat
        run: |
          sudo apt update
          sudo apt install -y bc bison flex libssl-dev libelf-dev gcc make wget tar git
          echo "deb http://old-releases.ubuntu.com/ubuntu bionic main" | sudo tee /etc/apt/sources.list.d/bionic.list
          sudo apt update
          sudo apt install -y libtinfo5

      - name: Download LLVM‑18.1.8 (ubuntu‑18.04 build, no proxy)
        run: |
          mkdir -p "$WORKSPACE"/clang
          cd "$WORKSPACE"/clang
          wget --tries=5 --retry-connrefused -O clang.tar.xz https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang+llvm-18.1.8-x86_64-linux-gnu-ubuntu-18.04.tar.xz
          tar -xf clang.tar.xz --strip-components=1
          chmod +x bin/*

      - name: Download s25_gki v6.6.152‑r21 kernel source (no proxy)
        run: |
          mkdir -p "$WORKSPACE"/android-kernel
          cd "$WORKSPACE"
          wget --tries=5 --retry-connrefused --show-progress -O source-kernel.tar.gz https://github.com/sungho-moon/s25_gki/releases/download/v6.6.152-r21/source-kernel.tar.gz
          tar -xf source-kernel.tar.gz -C "$WORKSPACE"/android-kernel --strip-components=1
          ls -la "$WORKSPACE"/android-kernel

      - name: Override env variables
        run: |
          echo "DEVICE=pa3q" >> "$GITHUB_ENV"
          echo "KERNEL_DIR=$WORKSPACE/android-kernel" >> "$GITHUB_ENV"

      - name: Fetch KernelSU v3.3.0
        run: |
          cd "$WORKSPACE"
          git clone --depth 1 --branch v3.3.0 https://github.com/tiann/KernelSU.git KernelSU
          cp -r KernelSU/kernel "$KERNEL_DIR"/KernelSU
          ls -la "$KERNEL_DIR"/KernelSU

      - name: Generate defconfig & build modules(LKM only)
        run: |
          cd "$KERNEL_DIR"
          # fix script execute permission
          find . -name "*.sh" -exec chmod +x {} \;
          find ./scripts -type f -exec chmod +x {} \;
          chmod +x ./scripts/remove-stale-files

          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export PATH="$CLANG_PATH:$PATH"
          export LD=ld.lld
          export CLANG_TRIPLE=aarch64-linux-gnu-

          make s25_samsung_lkm_common_v2_defconfig

          {
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_LKM=y"
            echo "CONFIG_MODULES=y"
            echo "CONFIG_KPROBES=y"
            echo "CONFIG_KALLSYMS=y"
            echo "CONFIG_KALLSYMS_ALL=y"
            echo "CONFIG_MODULE_SIG=n"
            echo "CONFIG_MODULE_SIG_FORCE=n"
          } >> .config

          make olddefconfig

          # single thread for full error log
          make LD=ld.lld CLANG_TRIPLE=aarch64-linux-gnu- modules
          make -j1 LD=ld.lld CLANG_TRIPLE=aarch64-linux-gnu- modules_install INSTALL_MOD_PATH=./out/modules

          echo -e "\n===== KSU 关键配置检查 ====="
          grep -E 'CONFIG_KSU|CONFIG_KSU_LKM|CONFIG_MODULES|CONFIG_KPROBES|CONFIG_KALLSYMS|CONFIG_MODULE_SIG' .config
          echo -e "=============================\n"

      - name: Collect ksu.ko artifact
        uses: actions/upload-artifact@v4
        with:
          name: ksu-module-pa3q
          path: |
            ${{ env.KERNEL_DIR }}/.config
            ${{ env.KERNEL_DIR }}/out/modules/lib/modules/*/kernel/KernelSU/ksu.ko
          if-no-files-found: error
