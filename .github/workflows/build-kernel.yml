      - name: Download & extract full kernel source tarball
        run: |
          mkdir -p "$WORKSPACE"/android-kernel
          cd "$WORKSPACE"
          wget --tries=5 --retry-connrefused --show-progress -O source-kernel.tar.gz https://mirror.ghproxy.com/https://github.com/sungho-moon/s25_gki/releases/download/r21/source-kernel.tar.gz
          tar -xf source-kernel.tar.gz -C "$WORKSPACE"/android-kernel --strip-components=1
          ls -la "$WORKSPACE"/android-kernel

      - name: Override env variables
        run: |
          echo "DEVICE=pa3q" >> "$GITHUB_ENV"
          echo "KERNEL_DIR=$WORKSPACE/android-kernel" >> "$GITHUB_ENV"

      - name: Fetch KernelSU v3.3.0
        run: |
          cd "$WORKSPACE"
          git clone --depth 1 --branch v3.3.0 https://github.com/tiann/KernelSU.git KernelSU
          cp -r KernelSU/kernel "$KERNEL_DIR"/KernelSU

      - name: Generate defconfig & build modules(LKM only)
        run: |
          cd "$KERNEL_DIR"
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export PATH=$CLANG_PATH:$PATH

          # 使用源码自带lkm defconfig
          make s25_samsung_lkm_common_v2_defconfig

          # 注入ksu必须配置
          echo "CONFIG_KSU=y" >> .config
          echo "CONFIG_KSU_LKM=y" >> .config
          echo "CONFIG_MODULES=y" >> .config
          echo "CONFIG_KPROBES=y" >> .config
          echo "CONFIG_MODULE_SIG=n" >> .config
          echo "CONFIG_MODULE_SIG_FORCE=n" >> .config

          make olddefconfig

          # 只编译模块，不编译完整内核镜像
          make -j$(nproc) modules

      - name: Collect ksu.ko artifact
        uses: actions/upload-artifact@v4
        with:
          name: ksu-module-pa3q
          path: |
            ${{ env.KERNEL_DIR }}/out/modules/lib/modules/*/kernel/KernelSU/ksu.ko
            ${{ env.KERNEL_DIR }}/.config
          if-no-files-found: error
